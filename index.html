<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇大作战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            background: #16213e;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            z-index: 10;
            pointer-events: none;
        }

        #ui-overlay div {
            margin: 5px 0;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        #start-screen, #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 100;
            background: rgba(22, 33, 62, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            width: 90%;
            max-width: 400px;
        }

        #start-screen h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #00ff88;
        }

        #start-screen p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }

        #nickname {
            padding: 12px 20px;
            border: 2px solid #00ff88;
            border-radius: 25px;
            background: transparent;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            width: 100%;
        }

        button {
            padding: 12px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }

        button:hover {
            transform: scale(1.05);
        }

        #leaderboard {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        #leaderboard h3 {
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
        }

        #score-list {
            list-style: none;
            padding: 0;
        }

        #score-list li {
            color: #ccc;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay" class="hidden">
            <div id="score">长度: 10</div>
            <div id="kill-count">击杀: 0</div>
        </div>

        <div id="start-screen">
            <h1>🐍 贪吃蛇大作战</h1>
            <p>鼠标控制方向 | 按住鼠标/屏幕加速</p>
            <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="10">
            <button id="startBtn">开始游戏</button>
            <div id="leaderboard">
                <h3>🏆 历史排行榜</h3>
                <ol id="score-list"></ol>
            </div>
        </div>

        <div id="game-over" class="hidden">
            <h2>💀 游戏结束</h2>
            <p id="final-score" style="margin: 15px 0; font-size: 18px;"></p>
            <button id="restartBtn">再来一局</button>
        </div>
    </div>

    <script>
        // ============ 游戏配置 ============
        const CONFIG = {
            WORLD_SIZE: 3000,
            FOOD_COUNT: 300,
            BOT_COUNT: 10,
            SNAKE_SPEED: 3,
            BOOST_SPEED: 6,
            SEGMENT_SPACING: 5,
            INITIAL_LENGTH: 10,
            FOOD_VALUE: 1,
            KILL_VALUE: 15,
            TURN_SPEED: 0.15
        };

        // ============ 画布初始化 ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============ 工具函数 ============
        const random = (min, max) => Math.random() * (max - min) + min;
        const distance = (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        const randomColor = () => {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#00ff88', '#ff9f43'];
            return colors[Math.floor(Math.random() * colors.length)];
        };

        // ============ 食物类 ============
        class Food {
            constructor(x, y, value, color) {
                this.x = x !== undefined ? x : random(50, CONFIG.WORLD_SIZE - 50);
                this.y = y !== undefined ? y : random(50, CONFIG.WORLD_SIZE - 50);
                this.value = value || CONFIG.FOOD_VALUE;
                this.baseRadius = 4 + this.value * 0.8;
                this.color = color || randomColor();
                this.pulse = Math.random() * Math.PI * 2;
            }

            draw(ctx, camera) {
                this.pulse += 0.08;
                const r = this.baseRadius + Math.sin(this.pulse) * 1.5;
                const screenX = this.x - camera.x;
                const screenY = this.y - camera.y;

                if (screenX < -20 || screenX > canvas.width + 20 || screenY < -20 || screenY > canvas.height + 20) return;

                ctx.beginPath();
                ctx.arc(screenX, screenY, r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============ 蛇类 ============
        class Snake {
            constructor(name, isPlayer = false) {
                this.name = name;
                this.isPlayer = isPlayer;
                this.color = randomColor();
                this.x = random(200, CONFIG.WORLD_SIZE - 200);
                this.y = random(200, CONFIG.WORLD_SIZE - 200);
                this.angle = random(0, Math.PI * 2);
                this.targetAngle = this.angle;
                this.boosting = false;
                this.segments = [];
                this.length = CONFIG.INITIAL_LENGTH;
                this.score = 0;
                this.kills = 0;
                this.alive = true;
                this.radius = 10;

                for (let i = 0; i < this.length; i++) {
                    this.segments.push({
                        x: this.x - Math.cos(this.angle) * i * CONFIG.SEGMENT_SPACING,
                        y: this.y - Math.sin(this.angle) * i * CONFIG.SEGMENT_SPACING
                    });
                }
            }

            update(foods, snakes) {
                if (!this.alive) return;

                // 平滑转向
                let angleDiff = this.targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                this.angle += angleDiff * CONFIG.TURN_SPEED;

                // 移动
                const currentSpeed = this.boosting ? CONFIG.BOOST_SPEED : CONFIG.SNAKE_SPEED;
                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                // 边界检测
                if (this.x < 0 || this.x > CONFIG.WORLD_SIZE || this.y < 0 || this.y > CONFIG.WORLD_SIZE) {
                    this.die(foods);
                    return;
                }

                // 更新身体节点
                this.segments.unshift({ x: this.x, y: this.y });
                const targetLength = Math.floor(this.length);
                while (this.segments.length > targetLength) {
                    this.segments.pop();
                }

                // 加速消耗
                if (this.boosting && this.length > 5) {
                    this.length -= 0.08;
                    // 加速时掉落小食物
                    if (Math.random() < 0.3) {
                        const tail = this.segments[this.segments.length - 1];
                        foods.push(new Food(tail.x, tail.y, 0.5, this.color));
                    }
                }

                // 吃食物
                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    if (distance(this, food) < this.radius + food.baseRadius + 5) {
                        this.length += food.value;
                        this.score += food.value;
                        foods.splice(i, 1);
                        foods.push(new Food()); // 补充新食物
                    }
                }

                // 碰撞检测（撞其他蛇）
                for (const other of snakes) {
                    if (other === this || !other.alive) continue;
                    // 只检测前几十节，优化性能
                    const checkLength = Math.min(other.segments.length, 50);
                    for (let i = 0; i < checkLength; i++) {
                        const seg = other.segments[i];
                        if (distance(this, seg) < this.radius + other.radius - 2) {
                            this.die(foods);
                            other.kills++;
                            other.score += CONFIG.KILL_VALUE;
                            other.length += CONFIG.KILL_VALUE;
                            return;
                        }
                    }
                }
            }

            die(foods) {
                if (!this.alive) return;
                this.alive = false;
                // 死亡后掉落大量食物
                for (let i = 0; i < this.segments.length; i += 2) {
                    const seg = this.segments[i];
                    foods.push(new Food(seg.x + random(-10, 10), seg.y + random(-10, 10), 3, this.color));
                }
            }

            draw(ctx, camera) {
                if (!this.alive) return;

                // 绘制蛇身（从尾到头）
                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const seg = this.segments[i];
                    const screenX = seg.x - camera.x;
                    const screenY = seg.y - camera.y;

                    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) continue;

                    const ratio = 1 - (i / this.segments.length) * 0.5;
                    const r = this.radius * ratio;

                    ctx.beginPath();
                    ctx.arc(screenX, screenY, r, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();

                    // 绘制蛇头细节
                    if (i === 0) {
                        // 眼睛
                        const eyeOffset = 5;
                        const eyeAngle1 = this.angle + 0.6;
                        const eyeAngle2 = this.angle - 0.6;
                        
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(screenX + Math.cos(eyeAngle1) * eyeOffset, screenY + Math.sin(eyeAngle1) * eyeOffset, 4, 0, Math.PI * 2);
                        ctx.arc(screenX + Math.cos(eyeAngle2) * eyeOffset, screenY + Math.sin(eyeAngle2) * eyeOffset, 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(screenX + Math.cos(eyeAngle1) * (eyeOffset + 1), screenY + Math.sin(eyeAngle1) * (eyeOffset + 1), 2, 0, Math.PI * 2);
                        ctx.arc(screenX + Math.cos(eyeAngle2) * (eyeOffset + 1), screenY + Math.sin(eyeAngle2) * (eyeOffset + 1), 2, 0, Math.PI * 2);
                        ctx.fill();

                        // 名字标签
                        ctx.fillStyle = this.isPlayer ? '#00ff88' : '#fff';
                        ctx.font = 'bold 14px Microsoft YaHei';
                        ctx.textAlign = 'center';
                        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                        ctx.lineWidth = 3;
                        ctx.strokeText(this.name, screenX, screenY - 25);
                        ctx.fillText(this.name, screenX, screenY - 25);
                    }
                }
            }

            // AI 逻辑
            aiUpdate(foods, snakes) {
                if (!this.alive) return;

                let nearestFood = null;
                let minDist = Infinity;

                // 寻找视野内的食物
                for (const food of foods) {
                    const d = distance(this, food);
                    if (d < 300 && d < minDist) {
                        minDist = d;
                        nearestFood = food;
                    }
                }

                if (nearestFood) {
                    this.targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
                } else if (Math.random() < 0.05) {
                    this.targetAngle += random(-1, 1);
                }

                // 躲避边界
                const margin = 200;
                if (this.x < margin) this.targetAngle = 0;
                else if (this.x > CONFIG.WORLD_SIZE - margin) this.targetAngle = Math.PI;
                if (this.y < margin) this.targetAngle = Math.PI / 2;
                else if (this.y > CONFIG.WORLD_SIZE - margin) this.targetAngle = -Math.PI / 2;

                // 躲避其他蛇
                this.boosting = false;
                for (const other of snakes) {
                    if (other === this || !other.alive) continue;
                    for (let i = 0; i < Math.min(other.segments.length, 30); i++) {
                        const seg = other.segments[i];
                        const d = distance(this, seg);
                        if (d < 100) {
                            const avoidAngle = Math.atan2(this.y - seg.y, this.x - seg.x);
                            this.targetAngle = avoidAngle;
                            if (d < 50) this.boosting = true;
                            break;
                        }
                    }
                }
            }
        }

        // ============ 游戏全局状态 ============
        let player;
        let snakes = [];
        let foods = [];
        let camera = { x: 0, y: 0 };
        let gameRunning = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let leaderboard = JSON.parse(localStorage.getItem('snakeLeaderboard')) || [];

        // ============ 初始化游戏 ============
        function initGame() {
            const nickname = document.getElementById('nickname').value.trim() || '玩家';
            player = new Snake(nickname, true);
            snakes = [player];
            foods = [];

            for (let i = 0; i < CONFIG.FOOD_COUNT; i++) {
                foods.push(new Food());
            }

            const botNames = ['小蛇蛇', '贪吃王', '蛇王', '大蟒蛇', '毒蛇', '青蛇', '白蛇', '黑曼巴', '眼镜蛇', '金蛇'];
            for (let i = 0; i < CONFIG.BOT_COUNT; i++) {
                snakes.push(new Snake(botNames[i % botNames.length]));
            }

            document.getElementById('ui-overlay').classList.remove('hidden');
            gameRunning = true;
            gameLoop();
        }

        // ============ 游戏主循环 ============
        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 玩家鼠标控制
            if (player.alive) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                player.targetAngle = Math.atan2(mouseY - centerY, mouseX - centerX);
            }

            // 更新逻辑
            for (const snake of snakes) {
                if (!snake.isPlayer && snake.alive) {
                    snake.aiUpdate(foods, snakes);
                }
                snake.update(foods, snakes);
            }

            // 自动复活AI
            for (let i = 1; i < snakes.length; i++) {
                if (!snakes[i].alive) {
                    snakes[i] = new Snake(snakes[i].name);
                }
            }

            // 摄像机跟随
            if (player.alive) {
                camera.x = player.x - canvas.width / 2;
                camera.y = player.y - canvas.height / 2;
            }

            // 渲染
            drawGrid();
            drawBorder();

            for (const food of foods) food.draw(ctx, camera);
            
            // 先画AI，最后画玩家（保证玩家在最上层）
            for (const snake of snakes) {
                if (!snake.isPlayer) snake.draw(ctx, camera);
            }
            player.draw(ctx, camera);

            // 更新UI
            document.getElementById('score').textContent = `长度: ${Math.floor(player.length)}`;
            document.getElementById('kill-count').textContent = `击杀: ${player.kills}`;

            if (!player.alive) {
                gameOver();
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        // ============ 绘制辅助 ============
        function drawGrid() {
            const gridSize = 50;
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;

            const startX = -camera.x % gridSize;
            const startY = -camera.y % gridSize;

            ctx.beginPath();
            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawBorder() {
            ctx.strokeStyle = 'rgba(255, 68, 68, 0.8)';
            ctx.lineWidth = 8;
            ctx.strokeRect(-camera.x, -camera.y, CONFIG.WORLD_SIZE, CONFIG.WORLD_SIZE);
        }
