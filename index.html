<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;color:#fff;font-family:sans-serif;touch-action:none}
canvas{display:block}
.ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);padding:10px;border-radius:8px;font-size:16px}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.btn{padding:12px 30px;font-size:18px;background:#4caf50;color:#fff;border:none;border-radius:25px;margin-top:20px;cursor:pointer}
.hide{display:none!important}
#joy{position:absolute;bottom:30px;left:30px;width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%;border:2px solid #fff;display:none;z-index:5}
#knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:#4caf50;border-radius:50%}
#boostBtn{position:absolute;bottom:40px;right:30px;width:70px;height:70px;background:rgba(255,0,0,.5);border-radius:50%;border:2px solid #fff;display:none;z-index:5;text-align:center;line-height:70px;font-weight:bold}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="ui">长度: <span id="score">10</span></div>

<div class="screen" id="startScreen">
<h1>贪吃蛇</h1>
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn" style="background:#666;font-size:14px;padding:8px 20px" onclick="toggleMute()" id="muteBtn">音乐: 开</button>
</div>

<div class="screen hide" id="gameOverScreen">
<h1 style="color:red">游戏结束</h1>
<p>最终长度: <span id="finalScore">0</span></p>
<button class="btn" onclick="startGame()">重新开始</button>
</div>

<div id="joy"><div id="knob"></div></div>
<div id="boostBtn">加速</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;

// --- 游戏状态 ---
let snake = [], food = {}, dir = {x:1, y:0}, nextDir = {x:1, y:0};
let score = 10, gameOver = false, isBoosting = false;
let gridSize = 20;

// --- 动态帧率 ---
let lastTime = 0, frameCount = 0, lastFpsTime = 0, targetFps = 60;

// --- 音频 ---
let audioCtx, isMuted = false, bgmInterval;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type='square', vol=0.1) {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function startBGM() {
    if (!audioCtx || bgmInterval) return;
    let step = 0;
    const notes = [261, 293, 329, 349, 392, 440, 493, 523];
    bgmInterval = setInterval(() => {
        if (isMuted || gameOver) return;
        playTone(notes[step % notes.length], 0.2, 'sine', 0.05);
        step++;
    }, 300);
}
function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('muteBtn').innerText = isMuted ? '音乐: 关' : '音乐: 开';
}

// --- 初始化 ---
function resize() {
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w; canvas.height = h;
}
window.addEventListener('resize', resize);
resize();

function spawnFood() {
    food = {
        x: Math.floor(Math.random() * (w / gridSize)) * gridSize,
        y: Math.floor(Math.random() * (h / gridSize)) * gridSize
    };
}

function startGame() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    snake = [{x: 100, y: 100}, {x: 80, y: 100}, {x: 60, y: 100}];
    dir = {x:1, y:0}; nextDir = {x:1, y:0};
    score = 10; gameOver = false; isBoosting = false;
    
    document.getElementById('startScreen').classList.add('hide');
    document.getElementById('gameOverScreen').classList.add('hide');
    document.getElementById('ui').style.display = 'block';
    
    if (/Android|iPhone/i.test(navigator.userAgent)) {
        document.getElementById('joy').style.display = 'block';
        document.getElementById('boostBtn').style.display = 'block';
    }
    
    spawnFood();
    startBGM();
    requestAnimationFrame(loop);
}

// --- 控制 ---
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && dir.y === 0) nextDir = {x:0, y:-1};
    if (e.key === 'ArrowDown' && dir.y === 0) nextDir = {x:0, y:1};
    if (e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1, y:0};
    if (e.key === 'ArrowRight' && dir.x === 0) nextDir = {x:1, y:0};
    if (e.key === ' ') isBoosting = true;
});
document.addEventListener('keyup', e => { if (e.key === ' ') isBoosting = false; });

// 触屏摇杆
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
let joyActive = false, joyId = null;
joy.addEventListener('touchstart', e => {
    joyActive = true; joyId = e.changedTouches[0].identifier;
    handleJoy(e.changedTouches[0]);
});
joy.addEventListener('touchmove', e => {
    if (!joyActive) return;
    for (let t of e.changedTouches) if (t.identifier === joyId) handleJoy(t);
});
joy.addEventListener('touchend', () => {
    joyActive = false; knob.style.transform = 'translate(-50%, -50%)';
});
function handleJoy(t) {
    const rect = joy.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    const dx = t.clientX - cx, dy = t.clientY - cy;
    const angle = Math.atan2(dy, dx);
    knob.style.transform = `translate(calc(-50% + ${Math.cos(angle)*30}px), calc(-50% + ${Math.sin(angle)*30}px))`;
    
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && dir.x === 0) nextDir = {x:1, y:0};
        else if (dx < 0 && dir.x === 0) nextDir = {x:-1, y:0};
    } else {
        if (dy > 0 && dir.y === 0) nextDir = {x:0, y:1};
        else if (dy < 0 && dir.y === 0) nextDir = {x:0, y:-1};
    }
}
document.getElementById('boostBtn').addEventListener('touchstart', () => isBoosting = true);
document.getElementById('boostBtn').addEventListener('touchend', () => isBoosting = false);

// --- 主循环 ---
function loop(timestamp) {
    if (gameOver) return;
    
    // 动态帧率控制
    const delta = timestamp - lastTime;
    if (delta < 1000 / targetFps) {
        requestAnimationFrame(loop);
        return;
    }
    lastTime = timestamp;
    
    // 性能监测 (简单版)
    frameCount++;
    if (timestamp - lastFpsTime > 1000) {
        if (frameCount < 45 && targetFps === 60) targetFps = 45;
        frameCount = 0; lastFpsTime = timestamp;
    }

    update();
    draw();
    requestAnimationFrame(loop);
}

function update() {
    dir = nextDir;
    const speed = isBoosting ? 30 : 15; // 加速时移动更快
    const head = {x: snake[0].x + dir.x * speed, y: snake[0].y + dir.y * speed};

    // 撞墙或撞自己
    if (head.x < 0 || head.x >= w || head.y < 0 || head.y >= h || 
        snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        document.getElementById('gameOverScreen').classList.remove('hide');
        document.getElementById('finalScore').innerText = score;
        document.getElementById('ui').style.display = 'none';
        document.getElementById('joy').style.display = 'none';
        document.getElementById('boostBtn').style.display = 'none';
        return;
    }

    snake.unshift(head);

    // 吃食物
    if (Math.abs(head.x - food.x) < gridSize && Math.abs(head.y - food.y) < gridSize) {
        score += 5;
        document.getElementById('score').innerText = score;
        playTone(800, 0.1);
        spawnFood();
    } else {
        snake.pop();
    }
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, w, h);

    // 画食物
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2, 0, Math.PI*2);
    ctx.fill();

    // 画蛇
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#2ed573' : (isBoosting ? '#ffa502' : '#7bed9f');
        ctx.fillRect(s.x, s.y, gridSize-2, gridSize-2);
    });
}
</script>
</body>
</html>
