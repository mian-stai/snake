<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇大作战 - 完整版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #0f0f1a; font-family: sans-serif; color: #fff; }
        canvas { display: block; }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .score-panel {
            background: rgba(0, 0, 0, 0.6); padding: 15px 25px;
            border-radius: 12px; font-size: 20px; font-weight: bold;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        .rank-panel {
            background: rgba(0, 0, 0, 0.6); padding: 15px;
            border-radius: 12px; width: 200px;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        .rank-panel h3 { font-size: 15px; margin-bottom: 10px; text-align: center; color: #ffd700; }
        .rank-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .rank-item.me { color: #2ed573; font-weight: bold; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 26, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; z-index: 10;
        }
        h1 { font-size: 50px; margin-bottom: 20px; color: #2ed573; }
        .btn {
            padding: 15px 40px; font-size: 20px; background: #2ed573; color: #fff;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px;
        }
        .btn:hover { background: #26af61; }
        .hidden { display: none !important; }
        .controls-hint { margin-top: 30px; color: #888; font-size: 14px; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer" id="gameUI" style="display: none;">
        <div class="top-bar">
            <div class="score-panel">长度: <span id="score">10</span></div>
            <div class="rank-panel">
                <h3>🏆 排行榜</h3>
                <div id="rankList"></div>
            </div>
        </div>
        <div class="controls-hint" style="text-align: center; width: 100%;">移动鼠标控制方向 | 按住鼠标左键或空格键加速</div>
    </div>

    <div class="screen" id="startScreen">
        <h1>贪吃蛇大作战</h1>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div class="controls-hint">吞噬光点变长，撞击对手身体可将其击杀！</div>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <h1 style="color: #ff4757;">游戏结束</h1>
        <p style="font-size: 20px; margin-bottom: 20px;">最终长度: <span id="finalScore" style="color: #fff; font-weight: bold;">0</span></p>
        <button class="btn" onclick="startGame()">再来一局</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const rankListEl = document.getElementById('rankList');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameUI = document.getElementById('gameUI');
    const finalScoreEl = document.getElementById('finalScore');

    const CONFIG = {
        WORLD_SIZE: 3000,
        FOOD_COUNT: 400,
        AI_COUNT: 10,
        SPEED: 3,
        BOOST_SPEED: 6,
        SEG_DIST: 5,
        BASE_RADIUS: 10
    };

    let width, height;
    let camera = { x: 0, y: 0 };
    let foods = [];
    let snakes = [];
    let player;
    let isGameOver = true;
    let mouseX = 0, mouseY = 0;
    let isBoosting = false;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    const random = (min, max) => Math.random() * (max - min) + min;
    const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const randomColor = () => `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`;

    class Food {
        constructor(x, y, value = 1, color = randomColor()) {
            this.x = x !== undefined ? x : random(0, CONFIG.WORLD_SIZE);
            this.y = y !== undefined ? y : random(0, CONFIG.WORLD_SIZE);
            this.value = value;
            this.color = color;
            this.radius = Math.sqrt(value) * 3 + 2;
        }
        draw() {
            let sx = this.x - camera.x;
            let sy = this.y - camera.y;
            if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) return;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Snake {
        constructor(isPlayer = false, color = randomColor(), name = "") {
            this.isPlayer = isPlayer;
            this.color = color;
            this.name = name || (isPlayer ? "我" : `AI-${Math.floor(Math.random()*99)}`);
            this.reset();
        }

        reset() {
            this.segments = [];
            let startX = random(200, CONFIG.WORLD_SIZE - 200);
            let startY = random(200, CONFIG.WORLD_SIZE - 200);
            for (let i = 0; i < 10; i++) this.segments.push({ x: startX, y: startY });
            this.angle = random(0, Math.PI * 2);
            this.targetAngle = this.angle;
            this.score = 10;
            this.radius = CONFIG.BASE_RADIUS;
            this.alive = true;
        }

        update() {
            if (!this.alive) return;

            // 平滑转向
            let diff = this.targetAngle - this.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            this.angle += diff * 0.15;

            // 加速逻辑
            let boosting = this.isPlayer ? isBoosting : (Math.random() < 0.01 && this.score > 20);
            let speed = (boosting && this.score > 10) ? CONFIG.BOOST_SPEED : CONFIG.SPEED;
            
            if (boosting && this.score > 10) {
                this.score -= 0.1;
                if (Math.random() < 0.3) {
                    let tail = this.segments[this.segments.length - 1];
                    foods.push(new Food(tail.x, tail.y, 1, this.color));
                }
            }

            // 移动头部
            let head = this.segments[0];
            let nx = head.x + Math.cos(this.angle) * speed;
            let ny = head.y + Math.sin(this.angle) * speed;

            // 边界死亡
            if (nx < 0 || nx > CONFIG.WORLD_SIZE || ny < 0 || ny > CONFIG.WORLD_SIZE) {
                this.die();
                return;
            }

            this.segments.unshift({ x: nx, y: ny });
            
            // 身体跟随
            for (let i = 1; i < this.segments.length; i++) {
                let prev = this.segments[i - 1];
                let curr = this.segments[i];
                let d = dist(prev, curr);
                if (d > CONFIG.SEG_DIST) {
                    let a = Math.atan2(curr.y - prev.y, curr.x - prev.x);
                    curr.x = prev.x + Math.cos(a) * CONFIG.SEG_DIST;
                    curr.y = prev.y + Math.sin(a) * CONFIG.SEG_DIST;
                }
            }

            // 长度限制
            let maxSeg = Math.floor(this.score * 1.5);
            if (this.segments.length > maxSeg) this.segments.pop();

            // 吃食物
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (dist(head, f) < this.radius + f.radius + 5) {
                    this.score += f.value;
                    this.radius = Math.min(30, this.radius + 0.05);
                    foods.splice(i, 1);
                    if (this.isPlayer) scoreEl.innerText = Math.floor(this.score);
                }
            }

            // 撞别人身体死亡
            for (let other of snakes) {
                if (other === this || !other.alive) continue;
                if (dist(head, other.segments[0]) > 200) continue; 
                for (let seg of other.segments) {
                    if (dist(head, seg) < this.radius + other.radius - 2) {
                        this.die();
                        return;
                    }
                }
            }
        }

        die() {
            this.alive = false;
            for (let i = 0; i < this.segments.length; i += 2) {
                let seg = this.segments[i];
                foods.push(new Food(seg.x + random(-10,10), seg.y + random(-10,10), 3, this.color));
            }
            if (this.isPlayer) {
                isGameOver = true;
                finalScoreEl.innerText = Math.floor(this.score);
                gameOverScreen.classList.remove('hidden');
                gameUI.style.display = 'none';
            } else {
                setTimeout(() => { if(!isGameOver) this.reset(); }, 2000);
            }
        }

        draw() {
            if (!this.alive) return;
            for (let i = this.segments.length - 1; i >= 0; i--) {
                let seg = this.segments[i];
                let sx = seg.x - camera.x;
                let sy = seg.y - camera.y;
                if (sx < -50 || sx > width + 50 || sy < -50 || sy > height + 50) continue;

                ctx.fillStyle = this.color;
                ctx.beginPath();
                let r = i === 0 ? this.radius * 1.2 : this.radius;
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();
                
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    let off = this.radius * 0.5;
                    ctx.beginPath(); ctx.arc(sx + Math.cos(this.angle - 0.5)*off, sy + Math.sin(this.angle - 0.5)*off, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(sx + Math.cos(this.angle + 0.5)*off, sy + Math.sin(this.angle + 0.5)*off, 3, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        think() {
            if (this.isPlayer || !this.alive) return;
            let head = this.segments[0];
            
            // 边界躲避
            const margin = 200;
            if (head.x < margin) this.targetAngle = 0;
            else if (head.x > CONFIG.WORLD_SIZE - margin) this.targetAngle = Math.PI;
            else if (head.y < margin) this.targetAngle = Math.PI / 2;
            else if (head.y > CONFIG.WORLD_SIZE - margin) this.targetAngle = -Math.PI / 2;
            else {
                // 找食物
                let closest = null, minD = Infinity;
                for (let i = 0; i < foods.length; i += 5) {
                    let d = dist(head, foods[i]);
                    if (d < minD) { minD = d; closest = foods[i]; }
                }
                if (closest && minD < 500) {
                    this.targetAngle = Math.atan2(closest.y - head.y, closest.x - head.x);
                } else if (Math.random() < 0.05) {
                    this.targetAngle += random(-0.5, 0.5);
                }
            }
        }
    }

    function updateRanking() {
        let sorted = snakes.filter(s => s.alive).sort((a, b) => b.score - a.score).slice(0, 5);
        let html = '';
        sorted.forEach((s, i) => {
            html += `<div class="rank-item ${s.isPlayer ? 'me' : ''}">
                        <span>${i + 1}. ${s.name}</span><span>${Math.floor(s.score)}</span>
                     </div>`;
        });
        rankListEl.innerHTML = html;
    }

    function init() {
        foods = [];
        snakes = [];
        isGameOver = false;
        for (let i = 0; i < CONFIG.FOOD_COUNT; i++) foods.push(new Food());
        player = new Snake(true, '#2ed573', '我');
        snakes.push(player);
        for (let i = 0; i < CONFIG.AI_COUNT; i++) snakes.push(new Snake(false));
        camera.x = player.segments[0].x - width / 2;
        camera.y = player.segments[0].y - height / 2;
    }

    function loop() {
        if (isGameOver) return;

        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, width, height);

        // 绘制网格
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        const offsetX = -camera.x % gridSize;
        const offsetY = -camera.y % gridSize;
        ctx.beginPath();
        for (let x = offsetX; x < width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
        for (let y = offsetY; y < height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
        ctx.stroke();

        // 绘制边界
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 5;
        ctx.strokeRect(-camera.x, -camera.y, CONFIG.WORLD_SIZE, CONFIG.WORLD_SIZE);

        foods.forEach(f => f.draw());
        
        snakes.forEach(s => {
            s.think();
            s.update();
            s.draw();
        });

        // 相机跟随
        if (player.alive) {
            camera.x += (player.segments[0].x - width / 2 - camera.x) * 0.1;
            camera.y += (player.segments[0].y - height / 2 - camera.y) * 0.1;
        }

        // 玩家转向
        if (player.alive) {
            let dx = mouseX - width / 2;
            let dy = mouseY - height / 2;
            player.targetAngle = Math.atan2(dy, dx);
        }

        if (Date.now() % 500 < 20) updateRanking();

        requestAnimationFrame(loop);
    }

    function startGame() {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        gameUI.style.display = 'flex';
        init();
        loop();
    }

    window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mousedown', () => isBoosting = true);
    window.addEventListener('mouseup', () => isBoosting = false);
    window.addEventListener('keydown', e => { if(e.code === 'Space') isBoosting = true; });
    window.addEventListener('keyup', e => { if(e.code === 'Space') isBoosting = false; });

</script>
</body>
</html>
