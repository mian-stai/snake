<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇大作战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 2px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            background-color: #222;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 20px;
            display: flex;
            gap: 20px;
        }
        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            border: 2px solid #ff4444;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <div id="ui">
        <div>长度: <span id="score">0</span></div>
        <div>最高分: <span id="highScore">0</span></div>
        <div>提示: 按住空格键加速(消耗长度)</div>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="gameOverScreen">
        <h2>游戏结束!</h2>
        <p>你的最终长度: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">重新开始</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('highScore');
    const finalScoreElement = document.getElementById('finalScore');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // 游戏配置
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    // 游戏状态
    let snake = [];
    let velocityX = 0;
    let velocityY = 0;
    let food = { x: 0, y: 0 };
    let specialFood = null; // 死亡掉落的食物
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameLoop;
    let isBoosting = false;
    let baseSpeed = 100; // 基础速度(毫秒)
    let boostSpeed = 50; // 加速速度

    highScoreElement.innerText = highScore;

    // 初始化游戏
    function initGame() {
        // 初始蛇身 (居中)
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        velocityX = 1; // 向右移动
        velocityY = 0;
        score = 0;
        scoreElement.innerText = score;
        specialFood = null;
        generateFood();
        gameOverScreen.style.display = 'none';
        
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, baseSpeed);
    }

    // 生成普通食物
    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        
        // 确保食物不会生成在蛇身上
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                generateFood();
                return;
            }
        }
    }

    // 生成特殊食物 (死亡掉落)
    function dropSpecialFood(x, y) {
        specialFood = { x: x, y: y };
    }

    // 游戏主循环
    function update() {
        // 计算新蛇头位置
        const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

        // 碰撞检测：墙壁
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver();
            return;
        }

        // 碰撞检测：自身
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                gameOver();
                return;
            }
        }

        // 移动蛇
        snake.unshift(head); // 添加新头

        // 吃普通食物
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.innerText = score;
            generateFood();
            // 吃到食物稍微加快基础速度
            if (baseSpeed > 50) baseSpeed -= 1; 
            clearInterval(gameLoop);
            gameLoop = setInterval(update, isBoosting ? boostSpeed : baseSpeed);
        } 
        // 吃特殊食物
        else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
            score += 50; // 特殊食物分值更高
            scoreElement.innerText = score;
            specialFood = null;
            // 不需要pop，蛇变长
        }
        else {
            snake.pop(); // 没吃到食物，移除尾巴
        }

        // 加速机制：消耗长度
        if (isBoosting && snake.length > 5) {
            // 每隔几帧掉一点长度，这里简单处理为每次移动都掉
            if (Math.random() > 0.7) { 
                const tail = snake.pop();
                // 有概率在尾巴处掉落食物
                if (Math.random() > 0.5) {
                    dropSpecialFood(tail.x, tail.y);
                }
            }
        }

        draw();
    }

    // 绘制游戏画面
    function draw() {
        // 清空画布
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制蛇
        snake.forEach((part, index) => {
            // 蛇头颜色不同
            if (index === 0) {
                ctx.fillStyle = isBoosting ? '#ff4444' : '#4CAF50';
            } else {
                ctx.fillStyle = '#8BC34A';
            }
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });

        // 绘制普通食物
        ctx.fillStyle = '#FFEB3B';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // 绘制特殊食物
        if (specialFood) {
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(specialFood.x * gridSize, specialFood.y * gridSize, gridSize - 2, gridSize - 2);
            // 加个发光效果
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FF5722';
            ctx.fillRect(specialFood.x * gridSize, specialFood.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }
    }

    // 游戏结束
    function gameOver() {
        clearInterval(gameLoop);
        finalScoreElement.innerText = score;
        gameOverScreen.style.display = 'block';
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreElement.innerText = highScore;
        }
        
        // 死亡时掉落大量食物
        snake.forEach((part, index) => {
            if (index % 3 === 0) { // 每隔一节掉落一个
                // 这里为了简单，只保留最后一个掉落点作为特殊食物，或者可以扩展为数组
                dropSpecialFood(part.x, part.y); 
            }
        });
    }

    // 重置游戏
    function resetGame() {
        baseSpeed = 100; // 重置速度
        initGame();
    }

    // 键盘控制
    document.addEventListener('keydown', (e) => {
        // 防止方向键滚动页面
        if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        switch (e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                if (velocityY === 0) { velocityX = 0; velocityY = -1; }
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                if (velocityY === 0) { velocityX = 0; velocityY = 1; }
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                if (velocityX === 0) { velocityX = -1; velocityY = 0; }
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                if (velocityX === 0) { velocityX = 1; velocityY = 0; }
                break;
            case ' ': // 空格键加速
                if (!isBoosting) {
                    isBoosting = true;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, boostSpeed);
                }
                break;
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === ' ') {
            isBoosting = false;
            clearInterval(gameLoop);
            gameLoop = setInterval(update, baseSpeed);
        }
    });

    // 启动游戏
    initGame();

</script>
</body>
</html>
