<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇大作战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 153, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #222;
            display: block;
        }

        /* UI 覆盖层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #00ff99;
            text-shadow: 0 0 10px #00ff99;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ccc;
        }

        button {
            background: #00ff99;
            color: #1a1a1a;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ff99;
        }

        /* 排行榜样式 */
        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 150px;
            z-index: 5;
        }

        #score-board h3 {
            margin: 0 0 10px 0;
            color: #00ff99;
            font-size: 1.2rem;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 1rem;
        }

        .hidden {
            display: none !important;
        }
        
        #final-score {
            font-size: 1.5rem;
            color: #ff5555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- 排行榜 -->
        <div id="score-board" class="hidden">
            <h3>排行榜</h3>
            <div class="rank-item"><span>当前得分</span> <span id="current-score">0</span></div>
            <div class="rank-item"><span>最高记录</span> <span id="high-score">0</span></div>
        </div>

        <!-- 开始界面 -->
        <div id="start-screen" class="overlay">
            <h1>贪吃蛇大作战</h1>
            <p>使用 方向键 或 WASD 控制移动</p>
            <button id="start-btn">开始游戏</button>
        </div>

        <!-- 游戏结束界面 -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>游戏结束</h1>
            <div id="final-score">得分: 0</div>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 元素
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreBoard = document.getElementById('score-board');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        
        // 游戏变量
        const gridSize = 20; // 格子大小
        const tileCount = canvas.width / gridSize; // 格子数量
        
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0; // 水平移动方向
        let dy = 0; // 垂直移动方向
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let speed = 100; // 游戏速度（毫秒）
        let changingDirection = false;

        // 初始化最高分显示
        highScoreEl.textContent = highScore;

        // 事件监听
        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', initGame);
        
        document.addEventListener('keydown', changeDirection);

        function initGame() {
            // 重置状态
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1; // 初始向右移动
            dy = 0;
            score = 0;
            speed = 100;
            currentScoreEl.textContent = score;
            
            // 生成食物
            generateFood();

            // 切换界面
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreBoard.classList.remove('hidden');

            // 启动循环
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function update() {
            changingDirection = false;

            // 计算新蛇头位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 碰撞检测：撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 碰撞检测：撞自己
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // 移动蛇
            snake.unshift(head); // 添加新头

            // 检测是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                generateFood();
                
                // 每吃5个食物加速一点
                if (score % 50 === 0 && speed > 50) {
                    speed -= 5;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, speed);
                }
            } else {
                snake.pop(); // 没吃到食物，去掉尾巴
            }

            draw();
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画网格 (可选，为了美观)
            ctx.strokeStyle = '#333';
            for(let i=0; i<tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 画食物
            ctx.fillStyle = '#ff5555';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff5555';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.shadowBlur = 0; // 重置阴影

            // 画蛇
            snake.forEach((part, index) => {
                // 蛇头颜色亮一点，身体渐暗
                if (index === 0) {
                    ctx.fillStyle = '#00ff99';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff99';
                } else {
                    ctx.fillStyle = '#00cc7a';
                    ctx.shadowBlur = 0;
                }
                
                // 稍微留一点缝隙让蛇看起来像一节一节的
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function generateFood() {
            let newFoodPosition;
            let isOnSnake = true;

            // 确保食物不会生成在蛇身上
            while (isOnSnake) {
                isOnSnake = false;
                newFoodPosition = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                for (let part of snake) {
                    if (part.x === newFoodPosition.x && part.y === newFoodPosition.y) {
                        isOnSnake = true;
                        break;
                    }
                }
            }
            food = newFoodPosition;
        }

        function changeDirection(e) {
            if (changingDirection) return;

            const key = e.key;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // 阻止默认滚动行为
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) {
                e.preventDefault();
            }

            // 上
            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && !goingDown) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            // 下
            if ((key === 'ArrowDown' || key === 's' || key === 'S') && !goingUp) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
            // 左
            if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && !goingRight) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            // 右
            if ((key === 'ArrowRight' || key === 'd' || key === 'D') && !goingLeft) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = `最终得分: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
