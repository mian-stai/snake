<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>贪吃蛇 - 恒定速度版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;color:#fff;font-family:'Microsoft YaHei',sans-serif;touch-action:none}
canvas{display:block}
.ui{position:absolute;top:15px;left:15px;background:rgba(0,0,0,.7);padding:12px 20px;border-radius:10px;font-size:18px;font-weight:bold}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
h1{font-size:36px;color:#00d9ff;margin-bottom:20px;text-shadow:0 0 20px rgba(0,217,255,.5)}
.btn{padding:15px 40px;font-size:18px;background:linear-gradient(45deg,#00d9ff,#00ff88);color:#1a1a2e;border:none;border-radius:30px;margin:10px;cursor:pointer;font-weight:bold;transition:transform .2s}
.btn:hover{transform:scale(1.05)}
.btn-secondary{background:#555;color:#fff}
.hide{display:none!important}
#joy{position:absolute;bottom:40px;left:40px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%;border:2px solid rgba(255,255,255,.3);display:none;z-index:5}
#knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:rgba(0,217,255,.8);border-radius:50%}
#boostBtn{position:absolute;bottom:50px;right:40px;width:80px;height:80px;background:rgba(255,107,107,.6);border-radius:50%;border:2px solid rgba(255,255,255,.3);display:none;z-index:5;text-align:center;line-height:80px;font-weight:bold;font-size:16px}
.info{color:#888;font-size:14px;margin-top:15px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="ui">长度: <span id="score">10</span> | 速度: <span id="speedDisplay">正常</span></div>

<div class="screen" id="startScreen">
<h1>🐍 贪吃蛇</h1>
<p style="color:#aaa;margin-bottom:10px">恒定速度 · 永不加速</p>
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn btn-secondary" onclick="toggleMute()" id="muteBtn">🔊 音乐: 开</button>
<div class="info">电脑：方向键控制，空格加速<br>手机：左下摇杆，右下加速</div>
</div>

<div class="screen hide" id="gameOverScreen">
<h1 style="color:#ff6b6b">游戏结束</h1>
<p style="font-size:20px;margin:15px 0">最终长度: <span id="finalScore" style="color:#00d9ff;font-weight:bold">0</span></p>
<button class="btn" onclick="startGame()">再来一局</button>
<button class="btn btn-secondary" onclick="backToMenu()">返回菜单</button>
</div>

<div id="joy"><div id="knob"></div></div>
<div id="boostBtn">加速</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;

// ==================== 核心配置 ====================
const CONFIG = {
    gridSize: 20,           // 格子大小
    baseSpeed: 8,           // 基础速度：每秒移动8格（固定不变！）
    boostSpeed: 15,         // 加速时速度
    initialLength: 10,      // 初始长度
    foodValue: 1            // 食物增加长度
};

// ==================== 游戏状态 ====================
let snake = [];
let food = {};
let direction = {x: 1, y: 0};
let nextDirection = {x: 1, y: 0};
let score = CONFIG.initialLength;
let gameOver = false;
let isBoosting = false;
let gameStarted = false;

// ==================== 固定时间步长控制 ====================
// 这是解决"越玩越快"的核心！
let lastTime = 0;
let accumulator = 0;
const FIXED_TIME_STEP = 1000 / 60;  // 逻辑更新固定60次/秒
let moveTimer = 0;  // 移动计时器

// ==================== 音频系统 ====================
let audioCtx = null;
let isMuted = false;
let bgmInterval = null;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, duration, type = 'square', volume = 0.1) {
    if (!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function startBGM() {
    if (!audioCtx || bgmInterval) return;
    const notes = [261, 293, 329, 349, 392, 440, 493, 523];
    let step = 0;
    bgmInterval = setInterval(() => {
        if (isMuted || gameOver || !gameStarted) return;
        playTone(notes[step % notes.length], 0.15, 'sine', 0.05);
        step++;
    }, 250);
}

function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('muteBtn').innerText = isMuted ? '🔇 音乐: 关' : '🔊 音乐: 开';
}

// ==================== 初始化 ====================
function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
}
window.addEventListener('resize', resize);
resize();

function spawnFood() {
    const cols = Math.floor(w / CONFIG.gridSize);
    const rows = Math.floor(h / CONFIG.gridSize);
    food = {
        x: Math.floor(Math.random() * cols) * CONFIG.gridSize,
        y: Math.floor(Math.random() * rows) * CONFIG.gridSize
    };
    // 确保食物不在蛇身上
    for (let seg of snake) {
        if (seg.x === food.x && seg.y === food.y) {
            spawnFood();
            return;
        }
    }
}

function startGame() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    // 重置所有状态
    snake = [];
    const startX = Math.floor(w / 2 / CONFIG.gridSize) * CONFIG.gridSize;
    const startY = Math.floor(h / 2 / CONFIG.gridSize) * CONFIG.gridSize;
    for (let i = 0; i < CONFIG.initialLength; i++) {
        snake.push({x: startX - i * CONFIG.gridSize, y: startY});
    }
    
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = CONFIG.initialLength;
    gameOver = false;
    isBoosting = false;
    gameStarted = true;
    
    // 重置时间控制
    lastTime = 0;
    accumulator = 0;
    moveTimer = 0;
    
    document.getElementById('startScreen').classList.add('hide');
    document.getElementById('gameOverScreen').classList.add('hide');
    document.getElementById('ui').style.display = 'block';
    document.getElementById('score').innerText = score;
    document.getElementById('speedDisplay').innerText = '正常';
    
    // 移动端显示控制
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
        document.getElementById('joy').style.display = 'block';
        document.getElementById('boostBtn').style.display = 'block';
    }
    
    spawnFood();
    startBGM();
    requestAnimationFrame(gameLoop);
}

function backToMenu() {
    gameStarted = false;
    document.getElementById('gameOverScreen').classList.add('hide');
    document.getElementById('startScreen').classList.remove('hide');
    document.getElementById('ui').style.display = 'none';
    document.getElementById('joy').style.display = 'none';
    document.getElementById('boostBtn').style.display = 'none';
}

// ==================== 输入控制 ====================
document.addEventListener('keydown', e => {
    if (!gameStarted || gameOver) return;
    
    switch(e.key) {
        case 'ArrowUp':
            if (direction.y === 0) nextDirection = {x: 0, y: -1};
            break;
        case 'ArrowDown':
            if (direction.y === 0) nextDirection = {x: 0, y: 1};
            break;
        case 'ArrowLeft':
            if (direction.x === 0) nextDirection = {x: -1, y: 0};
            break;
        case 'ArrowRight':
            if (direction.x === 0) nextDirection = {x: 1, y: 0};
            break;
        case ' ':
            isBoosting = true;
            document.getElementById('speedDisplay').innerText = '加速';
            break;
    }
});

document.addEventListener('keyup', e => {
    if (e.key === ' ') {
        isBoosting = false;
        document.getElementById('speedDisplay').innerText = '正常';
    }
});

// 触屏摇杆
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyActive = false;
let joyId = null;

joy.addEventListener('touchstart', e => {
    joyActive = true;
    joyId = e.changedTouches[0].identifier;
    handleJoyMove(e.changedTouches[0]);
});

joy.addEventListener('touchmove', e => {
    if (!joyActive) return;
    for (let touch of e.changedTouches) {
        if (touch.identifier === joyId) {
            handleJoyMove(touch);
            break;
        }
    }
});

joy.addEventListener('touchend', () => {
    joyActive = false;
    knob.style.transform = 'translate(-50%, -50%)';
});

function handleJoyMove(touch) {
    const rect = joy.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dx = touch.clientX - centerX;
    const dy = touch.clientY - centerY;
    const angle = Math.atan2(dy, dx);
    const distance = Math.min(Math.hypot(dx, dy), 35);
    
    knob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px))`;
    
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x === 0) nextDirection = {x: 1, y: 0};
        else if (dx < 0 && direction.x === 0) nextDirection = {x: -1, y: 0};
    } else {
        if (dy > 0 && direction.y === 0) nextDirection = {x: 0, y: 1};
        else if (dy < 0 && direction.y === 0) nextDirection = {x: 0, y: -1};
    }
}

// 加速按钮
document.getElementById('boostBtn').addEventListener('touchstart', () => {
    isBoosting = true;
    document.getElementById('speedDisplay').innerText = '加速';
});
document.getElementById('boostBtn').addEventListener('touchend', () => {
    isBoosting = false;
    document.getElementById('speedDisplay').innerText = '正常';
});

// ==================== 游戏主循环 ====================
function gameLoop(timestamp) {
    if (!gameStarted || gameOver) return;
    
    // 计算时间差
    if (lastTime === 0) lastTime = timestamp;
    let deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    // 防止后台切回时时间差过大
    if (deltaTime > 250) deltaTime = 250;
    
    // 累积时间
    accumulator += deltaTime;
    
    // 固定时间步长更新逻辑
    while (accumulator >= FIXED_TIME_STEP) {
        update(FIXED_TIME_STEP);
        accumulator -= FIXED_TIME_STEP;
    }
    
    // 渲染
    draw();
    
    requestAnimationFrame(gameLoop);
}

// ==================== 逻辑更新 ====================
function update(deltaTime) {
    // 移动计时器
    const currentSpeed = isBoosting ? CONFIG.boostSpeed : CONFIG.baseSpeed;
    const moveInterval = 1000 / currentSpeed;  // 每格移动需要的时间
    
    moveTimer += deltaTime;
    
    // 只有达到移动间隔才移动
    if (moveTimer >= moveInterval) {
        moveTimer = 0;
        moveSnake();
    }
}

function moveSnake() {
    direction = nextDirection;
    
    const head = {
        x: snake[0].x + direction.x * CONFIG.gridSize,
        y: snake[0].y + direction.y * CONFIG.gridSize
    };
    
    // 撞墙检测
    if (head.x < 0 || head.x >= w || head.y < 0 || head.y >= h) {
        endGame();
        return;
    }
    
    // 撞自己检测
    for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
            endGame();
            return;
        }
    }
    
    // 移动
    snake.unshift(head);
    
    // 吃食物
    if (Math.abs(head.x - food.x) < CONFIG.gridSize && Math.abs(head.y - food.y) < CONFIG.gridSize) {
        score += CONFIG.foodValue;
        document.getElementById('score').innerText = score;
        playTone(800, 0.1, 'square', 0.1);
        spawnFood();
    } else {
        snake.pop();
    }
}

function endGame() {
    gameOver = true;
    gameStarted = false;
    playTone(200, 0.5, 'sawtooth', 0.2);
    
    document.getElementById('gameOverScreen').classList.remove('hide');
    document.getElementById('finalScore').innerText = score;
    document.getElementById('ui').style.display = 'none';
    document.getElementById('joy').style.display = 'none';
    document.getElementById('boostBtn').style.display = 'none';
}

// ==================== 渲染 ====================
function draw() {
    // 背景
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);
    
    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += CONFIG.gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
    }
    for (let y = 0; y < h; y += CONFIG.gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }
    
    // 食物
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x + CONFIG.gridSize/2, food.y + CONFIG.gridSize/2, CONFIG.gridSize/2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // 蛇
    snake.forEach((seg, i) => {
        if (i === 0) {
            // 蛇头
            ctx.fillStyle = isBoosting ? '#ffa502' : '#00d9ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = isBoosting ? '#ffa502' : '#00d9ff';
        } else {
            // 蛇身渐变
            const gradient = ctx.createLinearGradient(seg.x, seg.y, seg.x + CONFIG.gridSize, seg.y + CONFIG.gridSize);
            gradient.addColorStop(0, isBoosting ? '#ff7f50' : '#00ff88');
            gradient.addColorStop(1, isBoosting ? '#ffa502' : '#00d9ff');
            ctx.fillStyle = gradient;
            ctx.shadowBlur = 0;
        }
        
        ctx.fillRect(seg.x + 1, seg.y + 1, CONFIG.gridSize - 2, CONFIG.gridSize - 2);
    });
    ctx.shadowBlur = 0;
}
</script>
</body>
</html>
